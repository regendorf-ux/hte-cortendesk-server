; HTE Remote server image (phase 9): hte-console, hbbs and hbbr under one supervisord, as uid 82 (no root, no `user=`).
; Why supervisord and not something lighter: it is the supervisor that ran hbbs and hbbr in production inside the CortenDesk image,
; with these same program lines (docker/rustdesk-server.conf of CortenDesk's console), so the restart and stop behaviour is known
; and nothing new has to be learned or tested without Docker at hand. A lighter one (s6, runit, a shell loop) saves about 40 MB
; of image and costs a new unknown; this box has 35 GB free.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
; supervisord exits at start if it cannot get minfds descriptors; entrypoint.sh raises the soft limit toward the hard one.
minfds=1024

; The console: pages, client API, server link, the scheduler. Priority 20: started after hbbs and hbbr and stopped before them,
; with time to finish its requests and give its scheduler locks back (a clean stop releases them in the cache_locks table).
[program:hte-console]
command=hte-console serve
directory=/data
priority=20
environment=RUST_LOG="%(ENV_HTE_CONSOLE_LOG)s"
startsecs=3
stopwaitsecs=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startretries=100000

; Both run out of /data/rustdesk, which holds the key pair and the peer database. -k _ means "use id_ed25519 in that
; directory and require it": hbbs enforces a key by default but hbbr does not, and without it anyone who can reach 21117
; can use the relay as an open proxy. RUSTDESK_RELAY_ADVERTISED is the address hbbs hands to clients for the relay.
; hbbs also reads HTE_REMOTE_CONSOLE_URL (http://127.0.0.1:8080, the console in this container) and
; HTE_REMOTE_SERVER_SECRET from the entrypoint: it pulls the device policy from the console and enforces it.
; Ports and DB_URL are pinned because both binaries read them from the environment (a PORT=8080 from a PaaS moved hbbs onto
; the console's port once, issue #77 upstream).
[program:hbbs]
command=hbbs -p 21116 -r %(ENV_RUSTDESK_RELAY_ADVERTISED)s -k _
environment=DB_URL="./db_v2.sqlite3",RUST_LOG="%(ENV_HBBS_RUST_LOG)s"
directory=/data/rustdesk
priority=10
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startretries=100000

[program:hbbr]
command=hbbr -p 21117 -k _
environment=RUST_LOG="%(ENV_HBBS_RUST_LOG)s"
directory=/data/rustdesk
priority=10
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startretries=100000
