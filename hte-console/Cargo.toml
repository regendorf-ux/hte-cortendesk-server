[package]
name = "hte-console"
version = "0.1.1"
edition = "2021"
license = "AGPL-3.0-only"
description = "HTE Remote console, step by step in Rust. Phase 0: a shadow proxy that records sanitised fixtures. Phase 1: the device endpoints (heartbeat, sysinfo, audit, version) answered natively on the PHP console's database."
publish = false

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
once_cell = "1"
http = "1"
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
# Phase 1 (device endpoints). Versions chosen to reuse what the workspace lockfile already holds:
# rusqlite 0.27 links the same libsqlite3-sys 0.24 as hbbs's sqlx (two copies of `links = "sqlite3"` cannot coexist);
# sodiumoxide is hbbs's libsodium binding (crypto_box_seal and ed25519 -> curve25519 exactly as PHP's sodium_*).
rusqlite = { version = "0.27", features = ["bundled"] }
sodiumoxide = "0.2.7"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
