[package]
name = "hte-console"
version = "2.0.1"
edition = "2021"
license = "AGPL-3.0-only"
description = "HTE Remote's console in Rust: web pages, the RustDesk client and admin APIs, the ID server link (device policy and per-person reach) and scheduled jobs, on the database of CortenDesk 1.15."
publish = false

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
once_cell = "1"
http = "1"
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
# Phase 1 (device endpoints). Versions chosen to reuse what the workspace lockfile already holds:
# rusqlite 0.27 links the same libsqlite3-sys 0.24 as hbbs's sqlx (two copies of `links = "sqlite3"` cannot coexist);
# sodiumoxide is hbbs's libsodium binding (crypto_box_seal and ed25519 -> curve25519 exactly as the previous console's sodium_*).
rusqlite = { version = "0.27", features = ["bundled"] }
sodiumoxide = "0.2.7"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"
# Phase 2 (client sign-in), again only crates the workspace lockfile already holds: bcrypt 0.13 is hbbs's ($2y$ hashes,
# Laravel's Hash), ring 0.17 is rustls's (RS256 ID-token signatures; also signs for the replay's fake identity
# provider), sha1 for TOTP (otphp's default), url for the identity provider's endpoints.
bcrypt = "0.13"
ring = "0.17"
sha1 = "0.10"
url = "2"
# Phase 6 (backups): the .ndjson.gz members of the archive; flate2 and its pure-Rust miniz_oxide are already in the lockfile.
flate2 = "1"
# Phase 7b: the off-site copy. FTPS (explicit TLS, certificate not verified, as the previous console) uses rustls 0.23 directly, the version reqwest already holds.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Phase 8 (two-factor, invitations, password reset, e-mailed codes): the public CA roots for the SMTP client's certificate
# check (webpki-roots 0.26, already in the lockfile through reqwest) and the enrolment QR code (qrcodegen, pure Rust, no deps).
webpki-roots = "0.26"
qrcodegen = "1.8"

# Phase 7 (console pages): runtime templates (minijinja; the previous console's markup converts nearly one to one and a template edit
# needs no compile), the templates and assets embedded in the binary (include_dir), and tower's oneshot to hand a request
# this crate does not serve to CortenDesk's console unchanged.
minijinja = { version = "2", default-features = false, features = ["builtins", "multi_template", "std_collections", "serde", "json"] }
include_dir = "0.7"
tower = { version = "0.5", default-features = false, features = ["util"] }

[dev-dependencies]
tempfile = "3"
rcgen = "0.13"
