# HTE (2026-10-25, phase 9): build HTE Remote's server image, ghcr.io/regendorf-ux/hte-rd-server.
# ONE image: hbbs (ID server), hbbr (relay) and hte-console (the console, in Rust, from this same workspace) under supervisord,
# built from Dockerfile.hte. No PHP, no nginx. amd64 only: the server is amd64.
#
# Trigger: a git tag `hte-rd-server-v<x.y.z>` builds `hte-rd-server:<x.y.z>`. The version is HTE Remote's own (semver, from
# 2.0.0), the version of hte-console/Cargo.toml: the job fails when the tag differs, so a tag cut before the bump fails here.
# A tag is never reused or moved; a broken build gets the next number. The upstream versions it carries are image labels.
# The older images stay on GHCR untouched for rollback: hte-cortendesk (PHP console), hte-console, hte-cortendesk-server
# (plain hbbs/hbbr, built by hte-image.yml on `v<upstream>-hte.<n>`).
name: hte-rd-server

permissions:
  contents: read
  packages: write

on:
  workflow_dispatch:
  push:
    tags: ["hte-rd-server-v*"]

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/regendorf-ux/hte-rd-server

jobs:
  test:
    name: Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  build:
    name: Build amd64
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross --locked
      - name: Build
        run: cross build --release --all-features --target x86_64-unknown-linux-musl
      # The console links libsodium and SQLite (C, built from source by their -sys crates): the same `cross` that builds
      # hbbs gets both static for musl, exactly as .github/workflows/hte-console.yml has built it since phase 1.
      - name: Build hte-console
        run: cross build --release -p hte-console --target x86_64-unknown-linux-musl
      - name: Collect binaries
        run: |
          mkdir -p bin/amd64
          cp target/x86_64-unknown-linux-musl/release/{hbbs,hbbr,hte-console} bin/amd64/
          cp target/x86_64-unknown-linux-musl/release/cortendesk-utils bin/amd64/hte-rd-utils
          chmod +x bin/amd64/*
          file bin/amd64/* || true
      - uses: actions/upload-artifact@v4
        with:
          name: bin-amd64
          path: bin/amd64
          if-no-files-found: error

  image:
    name: Image
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bin-amd64
          path: bin/amd64
      - run: chmod +x bin/amd64/* && ls -l bin/amd64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Work out the tag
        id: tag
        run: |
          ref="${GITHUB_REF_NAME}"
          case "$ref" in hte-rd-server-v*) version="${ref#hte-rd-server-v}" ;; *) version="dev-${GITHUB_SHA::7}" ;; esac
          console="$(sed -n 's/^version = "\(.*\)"/\1/p' hte-console/Cargo.toml | head -1)"
          hbbs="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "tag version: $version; HTE Remote (hte-console/Cargo.toml): $console; hbbs/hbbr: $hbbs"
          case "$ref" in hte-rd-server-v*)
            [ "$version" = "$console" ] || { echo "the tag $ref does not match hte-console/Cargo.toml's version $console: bump it, commit, and tag the next number (a tag is never reused)" >&2; exit 1; }
            echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "HTE Remote versions are x.y.z" >&2; exit 1; } ;;
          esac
          echo "tags=${IMAGE}:${version}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "hbbs=${hbbs}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.hte
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tag.outputs.tags }}
          build-args: |
            HTE_REMOTE_VERSION=${{ steps.tag.outputs.version }}
            HTE_REMOTE_SERVER_VERSION=${{ steps.tag.outputs.hbbs }}
          labels: |
            org.opencontainers.image.version=${{ steps.tag.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            com.hte.remote.hbbs-version=${{ steps.tag.outputs.hbbs }}
            com.hte.remote.upstream.rustdesk-server=1.1.17
            com.hte.remote.upstream.cortendesk-server=1.1.1
            com.hte.remote.upstream.cortendesk=1.15.0
            org.opencontainers.image.title=HTE Remote server
            org.opencontainers.image.description=HTE Remote's ID server, relay and console (hbbs, hbbr, hte-console) in one image, with per-person reach enforcement. No PHP. Based on CortenDesk and RustDesk Server. AGPL-3.0.
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.source=https://github.com/regendorf-ux/hte-cortendesk-server
